<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mawuwebs static ads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* EDIT: site URL shown on every ad lives in SITE below (JS) */
  :root { --navy:#0b1642; --navy2:#142266; --gold:#f5a623; --ink:#fff; --w:1080; --h:1080; }
  * { box-sizing:border-box; margin:0; padding:0; }
  #root { height:100%; }
  html { font-size: calc(min(var(--w), var(--h)) * 1px / 100); }
  body { width:calc(var(--w) * 1px); height:calc(var(--h) * 1px); overflow:hidden;
         font-family:'Manrope',system-ui,sans-serif; color:var(--ink); background:var(--navy); }
  .ad { position:relative; width:100%; height:100%; padding:7rem 7rem 6rem; display:flex; flex-direction:column; justify-content:space-between;
        background: radial-gradient(120% 80% at 85% 0%, var(--navy2) 0%, var(--navy) 60%); overflow:hidden; }
  .wide .ad { padding:6rem 7rem; }
  .tall .ad { padding:9rem 7rem 8rem; }
  .ring { position:absolute; border:.5rem solid var(--gold); border-radius:50%; opacity:.16; }
  .brand { display:flex; align-items:center; gap:2rem; position:relative; z-index:2; }
  .brand img { width:11rem; height:11rem; filter:drop-shadow(0 0 2rem rgba(245,166,35,.35)); }
  .brand b { font-size:4.2rem; font-weight:800; letter-spacing:-.02em; }
  .brand b i { font-style:normal; color:var(--gold); }
  .kick { font-size:3rem; font-weight:700; letter-spacing:.22em; text-transform:uppercase; color:var(--gold); }
  h1 { font-size:11rem; line-height:.98; font-weight:800; letter-spacing:-.035em; }
  h1 em { font-style:normal; color:var(--gold); }
  p.sub { font-size:3.6rem; line-height:1.35; font-weight:500; color:rgba(255,255,255,.82); max-width:78rem; }
  .cta { display:flex; align-items:center; justify-content:space-between; gap:3rem; position:relative; z-index:2; }
  .btn { background:var(--gold); color:var(--navy); font-weight:800; font-size:3.6rem; padding:2.4rem 4.4rem; border-radius:99rem; white-space:nowrap; }
  .url { font-size:3.4rem; font-weight:700; color:rgba(255,255,255,.9); }
  .mid { position:relative; z-index:2; display:flex; flex-direction:column; gap:3.5rem; }
  .wide .mid { gap:2rem; } .wide h1 { font-size:8.2rem; } .wide p.sub { font-size:3.4rem; }
  .wide .brand img { width:9rem; height:9rem; } .wide .brand b { font-size:3.6rem; }
  .tall h1 { font-size:12.5rem; }
  /* hero portrait variant */
  .portrait-big { position:absolute; right:-4rem; bottom:24rem; width:48rem; height:48rem; z-index:1; filter:drop-shadow(0 0 6rem rgba(245,166,35,.3)); }
  .wide .portrait-big { width:44rem; height:44rem; right:6rem; bottom:8rem; }
  .d4 .mid { max-width:62rem; } .d4 h1 { font-size:10rem; } .wide.d4 h1 { font-size:7.6rem; }
  /* services grid variant */
  .chips { display:grid; grid-template-columns:repeat(2,1fr); gap:2rem; }
  .wide .chips { grid-template-columns:repeat(3,1fr); gap:1.4rem; }
  .chip { border:.35rem solid rgba(245,166,35,.55); border-radius:2.4rem; padding:2.4rem 3rem; font-size:3.6rem; font-weight:700; background:rgba(255,255,255,.04); }
  .chip span { color:var(--gold); margin-right:1.4rem; }
  .wide .chip { font-size:2.9rem; padding:1.8rem 2.2rem; }
  .d2 h1 { font-size:9rem; } .wide.d2 h1 { font-size:6.6rem; }
  /* big stat / quote variant */
  .d3 h1 { font-size:13rem; } .wide.d3 h1 { font-size:8.6rem; }
  .badge { align-self:flex-start; background:var(--gold); color:var(--navy); font-weight:800; font-size:3rem; letter-spacing:.18em; text-transform:uppercase; padding:1.4rem 3rem; border-radius:99rem; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const SITE = "mawuwebs.com";           // EDIT when final domain is confirmed
  const q = new URLSearchParams(location.search);
  const LIVE = q.get("live") === "1";   // launch-day variant
  const w = +q.get("w") || 1080, h = +q.get("h") || 1080, d = +q.get("d") || 1;
  document.documentElement.style.setProperty("--w", w);
  document.documentElement.style.setProperty("--h", h);
  document.body.className = (w / h > 1.4 ? "wide " : h / w > 1.5 ? "tall " : "") + "d" + d;
  const brand = `<div class="brand"><img src="../public/images/brand/portrait-mark.webp" alt=""><b>Mawu<i>Webs</i></b></div>`;
  const cta = (t) => `<div class="cta"><div class="btn">${t}</div><div class="url">${SITE}</div></div>`;
  const ads = {
    1: `${brand}
        <div class="mid"><div class="badge">${LIVE ? "Now live" : "Launching soon"}</div>
          <h1>Your business,<br><em>online</em> and<br>sorted.</h1>
          <p class="sub">Websites, apps, security and everyday IT support. We look after the tech so you can run the business.</p></div>
        ${cta(LIVE ? "Visit the site" : "Get early access")}`,
    2: `${brand}
        <div class="mid"><div class="kick">One team. All your IT.</div>
          <h1>Everything tech,<br><em>handled.</em></h1>
          <div class="chips">
            <div class="chip"><span>→</span>Websites</div><div class="chip"><span>→</span>Mobile apps</div>
            <div class="chip"><span>→</span>Cloud &amp; DevOps</div><div class="chip"><span>→</span>Cybersecurity</div>
            <div class="chip"><span>→</span>IT support</div><div class="chip"><span>→</span>SEO &amp; marketing</div>
          </div></div>
        ${cta(LIVE ? "Visit the site" : "Coming soon")}`,
    3: `${brand}
        <div class="mid"><div class="kick">Is your website working for you?</div>
          <h1>Slow site?<br>Lost <em>customers.</em></h1>
          <p class="sub">A fast, modern website that brings in business, built and supported by one team.</p></div>
        ${cta("Free IT health check")}`,
    4: `<img class="portrait-big" src="../public/images/brand/portrait-mark.webp" alt="">
        <div class="brand"><b>Mawu<i>Webs</i></b></div>
        <div class="mid"><div class="kick">Meet your tech partner</div>
          <h1>Built by a<br>real person.<br><em>For you.</em></h1>
          <p class="sub">Web, apps and IT support with a human on the other end.</p></div>
        ${cta(LIVE ? "Now live" : "Launching soon")}`,
  };
  const svc = (kick, h, sub, c) => `${brand}<div class="mid"><div class="kick">${kick}</div><h1>${h}</h1><p class="sub">${sub}</p></div>${cta(c)}`;
  ads[5] = svc("Web development", "A website that<br><em>wins</em> business.", "Fast, modern and built to turn visitors into customers.", "Start a project");
  ads[6] = svc("Cybersecurity", "Protect what<br>you've <em>built.</em>", "Security checks, backups and recovery so one bad day never sinks you.", "Get protected");
  ads[7] = svc("IT support", "Tech trouble?<br>We're <em>on it.</em>", "Real people, quick responses, everyday IT support for your team.", "Get support");
  document.getElementById("root").innerHTML =
    `<div class="ad"><div class="ring" style="width:90rem;height:90rem;right:-30rem;top:-30rem"></div>
     <div class="ring" style="width:50rem;height:50rem;left:-20rem;bottom:-18rem"></div>${ads[d]}</div>`;
  document.fonts.ready.then(() => document.body.dataset.ready = "1");
</script>
</body>
</html>
