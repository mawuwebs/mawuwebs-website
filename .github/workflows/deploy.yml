name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null && echo "key parses ok"
      - name: Sync code
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy" \
            --exclude-from=.dockerignore --exclude .env.production \
            ./ root@${{ secrets.VPS_HOST }}:/opt/mawuwebs/app/
      - name: Build and restart
        run: |
          ssh -i ~/.ssh/id_deploy root@${{ secrets.VPS_HOST }} \
            'cd /opt/mawuwebs/app && docker compose -f docker-compose.prod.yml up -d --build'
      - name: Health check
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS https://mawuwebs.cloud/api/health && exit 0
            sleep 10
          done
          exit 1
