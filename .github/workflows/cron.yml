name: Scheduled jobs

# Calls the site's cron endpoints on a schedule. Add two repository secrets:
#   APP_URL      https://your-domain (no trailing slash)
#   CRON_SECRET  same value as the CRON_SECRET environment variable on the server
# GitHub runs schedules in UTC, can delay them by several minutes, and pauses them after 60 days
# without repository activity. Every endpoint is safe to call twice.
on:
  schedule:
    - cron: "*/15 * * * *"   # uptime checks
    - cron: "0 7 * * *"      # daily billing and renewals
    - cron: "0 8 * * 1"      # weekly digests (Monday)
    - cron: "0 7 1 * *"      # monthly reports (1st)
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run now
        type: choice
        default: daily
        options: [uptime, daily, weekly, monthly]

permissions: {}

concurrency:
  group: cron-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call endpoints
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
          JOB: ${{ inputs.job }}
        run: |
          set -u
          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::warning::APP_URL or CRON_SECRET secret is not set; nothing was called."
            exit 0
          fi
          case "${SCHEDULE:-}" in
            "*/15 * * * *") JOB=uptime ;;
            "0 7 * * *")    JOB=daily ;;
            "0 8 * * 1")    JOB=weekly ;;
            "0 7 1 * *")    JOB=monthly ;;
          esac
          case "$JOB" in
            uptime)  PATHS="uptime" ;;
            daily)   PATHS="recurring-invoices recurring-expenses invoice-reminders quote-followups asset-renewals task-reminders billing-report?period=daily" ;;
            weekly)  PATHS="digest staff-digest project-updates billing-report?period=weekly" ;;
            monthly) PATHS="monthly-report billing-report?period=monthly" ;;
            *) echo "::error::unknown job '$JOB'"; exit 1 ;;
          esac
          fail=0
          for p in $PATHS; do
            echo "== $p"
            if ! curl -fsS --retry 2 --retry-delay 10 --max-time 120 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/$p"; then
              echo "::error::$p failed"; fail=1
            fi
            echo
          done
          exit $fail
